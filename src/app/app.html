<app-head-bar></app-head-bar>

<app-seach-bar
    [autos]="autoList"
    (onSelectCar)="selectCar($event)">
</app-seach-bar>

@if(selectedCar){
    <div class="modal-overlay">
        <div class="modal-content">

            <button class="close-btn"
                    (click)="selectedCar = null">
                ✕
            </button>

            <h2>{{selectedCar.brand}} {{selectedCar.model}}</h2>

            <img [src]="'images/' + selectedCar.photo">

            <p>{{selectedCar.description}}</p>

            <h3>Price : {{selectedCar.price}} DNT</h3>

            <p>Available : {{selectedCar.availability}} units</p>

        </div>
    </div>
}
